<div id="global-delete-modal"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="global-delete-modal-title">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="global-delete-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="global-delete-modal"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="global-delete-modal-title">Delete Experience?</h2>
        <p>
            Are you sure you want to delete
            <strong id="global-delete-modal-experience-title"></strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="global-delete-modal"
                    popovertargetaction="hide">Cancel</button>
            <form id="global-delete-modal-form" method="post" action="">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
